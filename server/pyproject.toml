[project]
name = "vigil-server"
version = "0.1.0"
description = "Vigil 服务端：客户端接入、状态机与告警"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7,<3.0",
    "itsdangerous>=2.2,<3.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# 项目日志与异常消息统一使用 % 占位符，保留该风格
# UP042：保留 (str, Enum) 现有 str() 语义，暂不切换 StrEnum
ignore = ["UP031", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入依赖函数调用默认值，B008 属误报
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
